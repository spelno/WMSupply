<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - William Pelagic Supply</title>
    <!-- Tailwind CSS untuk styling modern dan rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <!-- Header / Identitas Usaha -->
    <header class="bg-slate-900 text-white shadow-md py-6 px-4 mb-6">
        <div class="max-w-4xl mx-auto flex flex-col items-center text-center">
            <h1 class="text-2xl font-bold tracking-wider">WILLIAM PELAGIC SUPPLY</h1>
            <p class="text-xs text-slate-400 tracking-widest mt-1">PREMIUM TUNA PURVEYOR</p>
            <div class="mt-2 text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300">
                Rahang Tuna &bull; Dada Tuna (Loin)
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Kolom Form Transaksi -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Form Penjualan</h2>
            
            <!-- Input URL Web App Apps Script -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1">URL Web App Google Script</label>
                <input type="text" id="scriptUrl" placeholder="Tempel URL Web App di sini..." class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Pilih Pelanggan -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Rumah Makan / Pelanggan</label>
                <select id="selectPelanggan" class="w-full text-sm p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="">-- Memuat Pelanggan --</option>
                </select>
            </div>

            <!-- Pilih Produk -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Produk Tuna</label>
                <select id="selectProduk" class="w-full text-sm p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="">-- Memuat Produk --</option>
                </select>
            </div>

            <!-- Input Berat (Kg) -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Berat (Kg)</label>
                <input type="number" id="inputQty" value="1" min="0.1" step="0.1" class="w-full text-sm p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Tombol Tambah Item -->
            <button onclick="tambahItemKeranjang()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm py-2 px-4 rounded transition duration-200">
                + Tambahkan ke Pesanan
            </button>
        </section>

        <!-- Kolom Nota & Ringkasan -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Rincian Nota</h2>
                
                <!-- Tabel Item -->
                <div class="overflow-x-auto mb-4">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b text-slate-500">
                                <th class="pb-2">Produk</th>
                                <th class="pb-2">Qty</th>
                                <th class="pb-2">Subtotal</th>
                                <th class="pb-2 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelKeranjang">
                            <tr>
                                <td colspan="4" class="text-center py-4 text-slate-400">Belum ada item ditambahkan</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div>
                <!-- Total & Tombol Proses -->
                <div class="border-t pt-4 mb-4">
                    <div class="flex justify-between items-center text-base font-bold text-slate-900">
                        <span>Total Tagihan:</span>
                        <span id="grandTotal">Rp 0</span>
                    </div>
                </div>

                <button onclick="simpanDanKirimWA()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm py-3 px-4 rounded transition duration-200 flex items-center justify-center gap-2">
                    <span>Simpan & Buat Nota WA</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Modal / Preview Nota WhatsApp -->
    <div id="modalNota" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white max-w-lg w-full rounded-xl p-6 shadow-xl">
            <h3 class="font-bold text-lg mb-2 text-slate-800">Nota Digital WhatsApp</h3>
            <p class="text-xs text-slate-500 mb-4">Salin teks di bawah atau klik tombol kirim.</p>
            <textarea id="outputNotaWA" rows="10" class="w-full text-xs font-mono p-3 bg-slate-50 border border-slate-300 rounded mb-4 outline-none" readonly></textarea>
            <div class="flex gap-2">
                <button onclick="kirimKeWhatsApp()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-4 rounded">
                    Kirim ke WhatsApp
                </button>
                <button onclick="tutupModal()" class="bg-slate-300 hover:bg-slate-400 text-slate-800 text-xs font-semibold py-2 px-4 rounded">
                    Tutup
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logika Kasir -->
    <script>
        let keranjang = [];
        let dataProdukGlobal = [];
        let dataPelangganGlobal = [];

        // Ambil data master saat halaman dimuat (pastikan URL Script sudah diisi atau gunakan localStorage)
        window.onload = function() {
            const savedUrl = localStorage.getItem('wps_script_url');
            if (savedUrl) {
                document.getElementById('scriptUrl').value = savedUrl;
                muatDataMaster(savedUrl);
            }

            document.getElementById('scriptUrl').addEventListener('change', function() {
                localStorage.setItem('wps_script_url', this.value);
                muatDataMaster(this.value);
            });
        };

        function muatDataMaster(url) {
            if (!url) return;
            fetch(url + "?action=getDataMaster")
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        dataProdukGlobal = data.produk;
                        dataPelangganGlobal = data.pelanggan;
                        
                        // Isi Dropdown Pelanggan (Baris 1 adalah Header)
                        let selectCust = document.getElementById('selectPelanggan');
                        selectCust.innerHTML = '<option value="">-- Pilih Rumah Makan --</option>';
                        for (let i = 1; i < dataPelangganGlobal.length; i++) {
                            selectCust.innerHTML += `<option value="${dataPelangganGlobal[i][0]}">${dataPelangganGlobal[i][1]}</option>`;
                        }

                        // Isi Dropdown Produk (Baris 1 adalah Header)
                        let selectProd = document.getElementById('selectProduk');
                        selectProd.innerHTML = '<option value="">-- Pilih Produk --</option>';
                        for (let i = 1; i < dataProdukGlobal.length; i++) {
                            selectProd.innerHTML += `<option value="${dataProdukGlobal[i][0]}">${dataProdukGlobal[i][1]} (Rp ${dataProdukGlobal[i][2]}/Kg)</option>`;
                        }
                    }
                })
                .catch(err => alert("Gagal memuat data dari Spreadsheet. Periksa kembali URL Web App."));
        }

        function tambahItemKeranjang() {
            let idProd = document.getElementById('selectProduk').value;
            let qty = parseFloat(document.getElementById('inputQty').value);
            let idCust = document.getElementById('selectPelanggan').value;

            if (!idCust) { alert("Pilih pelanggan terlebih dahulu!"); return; }
            if (!idProd) { alert("Pilih produk terlebih dahulu!"); return; }
            if (!qty || qty <= 0) { alert("Masukkan berat (Kg) dengan benar!"); return; }

            // Cari data produk
            let produkObj = dataProdukGlobal.find(p => p[0] === idProd);
            let namaProduk = produkObj[1];
            let hargaNormal = parseFloat(produkObj[2]);

            // Cari data diskon pelanggan
            let custObj = dataPelangganGlobal.find(c => c[0] === idCust);
            let diskonPerKg = parseFloat(custObj[3]) || 0;

            let hargaJual = hargaNormal - diskonPerKg;
            let subtotal = hargaJual * qty;

            keranjang.push({
                id_produk: idProd,
                nama_produk: namaProduk,
                qty: qty,
                harga_normal: hargaNormal,
                potongan_kg: diskonPerKg,
                subtotal: subtotal
            });

            renderKeranjang();
        }

        function renderKeranjang() {
            let tbody = document.getElementById('tabelKeranjang');
            let grandTotal = 0;

            if (keranjang.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-400">Belum ada item ditambahkan</td></tr>`;
                document.getElementById('grandTotal').innerText = "Rp 0";
                return;
            }

            tbody.innerHTML = "";
            keranjang.forEach((item, index) => {
                grandTotal += item.subtotal;
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="py-2">${item.nama_produk}<br><span class="text-[10px] text-slate-400">@Rp ${item.harga_normal - item.potongan_kg} (Diskon Rp ${item.potongan_kg})</span></td>
                        <td class="py-2">${item.qty} Kg</td>
                        <td class="py-2">Rp ${item.subtotal.toLocaleString('id-ID')}</td>
                        <td class="py-2 text-right">
                            <button onclick="hapusItem(${index})" class="text-red-500 hover:text-red-700 font-bold">X</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('grandTotal').innerText = "Rp " + grandTotal.toLocaleString('id-ID');
        }

        function hapusItem(index) {
            keranjang.splice(index, 1);
            renderKeranjang();
        }

        function simpanDanKirimWA() {
            let url = document.getElementById('scriptUrl').value;
            let idCust = document.getElementById('selectPelanggan').value;

            if (!url) { alert("URL Web App belum diisi!"); return; }
            if (!idCust) { alert("Pilih pelanggan terlebih dahulu!"); return; }
            if (keranjang.length === 0) { alert("Keranjang masih kosong!"); return; }

            let grandTotal = keranjang.reduce((sum, item) => sum + item.subtotal, 0);
            let payload = {
                action: "simpanTransaksi",
                id_pelanggan: idCust,
                total_belanja: grandTotal,
                status: "LUNAS",
                items: keranjang
            };

            // Kirim ke Google Apps Script
            fetch(url, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                // Buat Teks Nota WhatsApp
                let custObj = dataPelangganGlobal.find(c => c[0] === idCust);
                let namaCust = custObj[1];
                let noWaCust = custObj[2];

                let tanggalHariIni = new Date().toLocaleDateString('id-ID');
                let teksNota = `*WILLIAM PELAGIC SUPPLY*\n`;
                teksNota += `----------------------------------------\n`;
                teksNota += `Tanggal  : ${tanggalHariIni}\n`;
                teksNota += `Kepada   : ${namaCust}\n`;
                teksNota += `----------------------------------------\n`;
                teksNota += `*DETAIL PESANAN:*\n`;

                keranjang.forEach((item, idx) => {
                    teksNota += `${idx + 1}. ${item.nama_produk}\n`;
                    teksNota += `   ${item.qty} Kg x Rp ${(item.harga_normal - item.potongan_kg).toLocaleString('id-ID')} = Rp ${item.subtotal.toLocaleString('id-ID')}\n`;
                    if(item.potongan_kg > 0) {
                        teksNota += `   *(Hemat Rp ${item.potongan_kg}/Kg)*\n`;
                    }
                });

                teksNota += `----------------------------------------\n`;
                teksNota += `*TOTAL TAGIHAN : Rp ${grandTotal.toLocaleString('id-ID')}*\n`;
                teksNota += `Status : LUNAS\n`;
                teksNota += `----------------------------------------\n`;
                teksNota += `Terima kasih atas kepercayaan Anda.`;

                document.getElementById('outputNotaWA').value = teksNota;
                document.getElementById('modalNota').classList.remove('hidden');
                
                // Simpan nomor WA di atribut tombol kirim
                window.targetNoWa = noWaCust;
            }).catch(err => {
                alert("Terjadi kesalahan saat menyimpan transaksi.");
            });
        }

        function kirimKeWhatsApp() {
            let teks = document.getElementById('outputNotaWA').value;
            let noWa = window.targetNoWa || "";
            let encodedTeks = encodeURIComponent(teks);
            window.open(`https://wa.me/${noWa}?text=${encodedTeks}`, '_blank');
        }

        function tutupModal() {
            document.getElementById('modalNota').classList.add('hidden');
            keranjang = [];
            renderKeranjang();
        }
    </script>
</body>
</html>
